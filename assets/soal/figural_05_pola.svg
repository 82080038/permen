<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220">
  <defs>
    <style>
      .frame { fill:none; stroke:#333; stroke-width:2 }
      .shape { fill:none; stroke:#000; stroke-width:2.5 }
      .dot { fill:#000 }
      .label { font-family:Arial,sans-serif; font-size:13px; fill:#333 }
      .arrow { fill:none; stroke:#666; stroke-width:2 }
    </style>
  </defs>

  <!-- Row 1 -->
  <!-- A1: Triangle pointing up -->
  <rect x="20" y="20" width="90" height="80" class="frame"/>
  <polygon points="65,35 90,75 40,75" class="shape"/>
  <text x="65" y="15" text-anchor="middle" class="label">1</text>

  <!-- A2: Triangle pointing right -->
  <rect x="130" y="20" width="90" height="80" class="frame"/>
  <polygon points="145,60 185,35 185,85" class="shape"/>
  <text x="175" y="15" text-anchor="middle" class="label">2</text>

  <!-- A3: Triangle pointing down -->
  <rect x="240" y="20" width="90" height="80" class="frame"/>
  <polygon points="285,85 310,45 260,45" class="shape"/>
  <text x="285" y="15" text-anchor="middle" class="label">3</text>

  <!-- Row 2 -->
  <!-- B1: Square -->
  <rect x="20" y="120" width="90" height="80" class="frame"/>
  <rect x="40" y="140" width="50" height="50" class="shape"/>
  <text x="65" y="220" text-anchor="middle" class="label">4</text>

  <!-- B2: Diamond (square rotated 45°) -->
  <rect x="130" y="120" width="90" height="80" class="frame"/>
  <polygon points="175,135 210,160 175,185 140,160" class="shape"/>
  <text x="175" y="220" text-anchor="middle" class="label">5</text>

  <!-- B3: ? (rotated again = back to square-ish / line) -->
  <rect x="240" y="120" width="90" height="80" class="frame"/>
  <text x="285" y="170" text-anchor="middle" font-size="28" fill="#999" font-family="Arial">?</text>
  <text x="285" y="220" text-anchor="middle" class="label">6</text>
</svg>
