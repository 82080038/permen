<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140">
  <defs>
    <style>
      .shape { fill:none; stroke:#000; stroke-width:2 }
      .fillshape { fill:#e8e8e8; stroke:#000; stroke-width:2 }
      .label { font-family:Arial,sans-serif; font-size:12px; fill:#333 }
      .arrow { fill:none; stroke:#666; stroke-width:2 }
    </style>
  </defs>

  <!-- Hubungan: bentuk + garis dalam + bentuk kecil di dalam -->

  <!-- A: Circle with cross inside, small triangle inside -->
  <circle cx="50" cy="65" r="35" class="shape"/>
  <line x1="25" y1="40" x2="75" y2="90" class="shape"/>
  <line x1="75" y1="40" x2="25" y2="90" class="shape"/>
  <polygon points="50,55 55,70 45,70" class="shape"/>
  <text x="50" y="120" text-anchor="middle" class="label">A</text>

  <!-- Arrow A→B -->
  <line x1="95" y1="65" x2="125" y2="65" class="arrow"/>
  <polygon points="125,60 140,65 125,70" fill="#666"/>

  <!-- B: Square with cross inside, small triangle inside -->
  <rect x="150" y="25" width="70" height="70" class="shape"/>
  <line x1="150" y1="25" x2="220" y2="95" class="shape"/>
  <line x1="220" y1="25" x2="150" y2="95" class="shape"/>
  <polygon points="185,50 195,65 175,65" class="shape"/>
  <text x="185" y="120" text-anchor="middle" class="label">B</text>

  <!-- Separator -->
  <text x="240" y="70" font-size="24" fill="#999">::</text>

  <!-- C: Circle with parallel lines inside, small square inside -->
  <circle cx="290" cy="65" r="35" class="shape"/>
  <line x1="30" y1="50" x2="80" y2="50" class="shape" transform="translate(260,0)"/>
  <line x1="30" y1="80" x2="80" y2="80" class="shape" transform="translate(260,0)"/>
  <rect x="280" y="55" width="10" height="10" class="shape"/>
  <text x="290" y="120" text-anchor="middle" class="label">C</text>

  <!-- Arrow C→? -->
  <line x1="335" y1="65" x2="355" y2="65" class="arrow"/>
  <polygon points="355,60 370,65 355,70" fill="#666"/>

  <!-- D (question): Should be square with parallel lines + small square -->
  <rect x="375" y="30" width="15" height="15" fill="none" stroke="#999" stroke-width="1"/>
  <text x="382" y="120" text-anchor="middle" class="label">D</text>
</svg>
