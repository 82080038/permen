<svg xmlns="http://www.w3.org/2000/svg" width="460" height="110" viewBox="0 0 460 110">
  <defs>
    <style>
      .shape { fill:none; stroke:#000; stroke-width:2 }
      .fillshape { fill:#d0d0d0; stroke:#000; stroke-width:2 }
      .label { font-family:Arial,sans-serif; font-size:12px; fill:#666 }
      .arrow { fill:#666 }
    </style>
  </defs>

  <!-- Pola: kotak berisi bentuk, jumlah sisi bertambah + fill bergantian -->

  <!-- 1: Segitiga (3 sisi), tidak diisi -->
  <rect x="5" y="5" width="55" height="55" class="shape"/>
  <polygon points="32,15 50,50 15,50" class="shape"/>
  <text x="32" y="80" text-anchor="middle" class="label">1</text>

  <polygon points="72,30 82,35 72,40" class="arrow"/>

  <!-- 2: Persegi (4 sisi), diisi -->
  <rect x="90" y="5" width="55" height="55" class="shape"/>
  <rect x="105" y="20" width="25" height="25" class="fillshape"/>
  <text x="117" y="80" text-anchor="middle" class="label">2</text>

  <polygon points="157,30 167,35 157,40" class="arrow"/>

  <!-- 3: Pentagon (5 sisi), tidak diisi -->
  <rect x="175" y="5" width="55" height="55" class="shape"/>
  <polygon points="202,15 222,28 215,50 190,50 182,28" class="shape"/>
  <text x="202" y="80" text-anchor="middle" class="label">3</text>

  <polygon points="242,30 252,35 242,40" class="arrow"/>

  <!-- 4: Hexagon (6 sisi), diisi -->
  <rect x="260" y="5" width="55" height="55" class="shape"/>
  <polygon points="287,15 305,25 305,45 287,55 270,45 270,25" class="fillshape"/>
  <text x="287" y="80" text-anchor="middle" class="label">4</text>

  <polygon points="327,30 337,35 327,40" class="arrow"/>

  <!-- 5: Heptagon (7 sisi), tidak diisi -->
  <rect x="345" y="5" width="55" height="55" class="shape"/>
  <polygon points="372,15 385,20 390,35 382,50 362,50 355,35 360,20" class="shape"/>
  <text x="372" y="80" text-anchor="middle" class="label">5</text>

  <polygon points="412,30 422,35 412,40" class="arrow"/>

  <!-- 6: ? -->
  <rect x="430" y="5" width="25" height="55" class="shape"/>
  <text x="442" y="40" text-anchor="middle" font-size="20" fill="#999" font-family="Arial">?</text>
  <text x="442" y="80" text-anchor="middle" class="label">?</text>
</svg>
