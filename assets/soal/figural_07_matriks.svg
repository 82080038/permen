<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <defs>
    <style>
      .frame { fill:none; stroke:#333; stroke-width:2 }
      .shape { fill:none; stroke:#000; stroke-width:2.5 }
      .label { font-family:Arial,sans-serif; font-size:13px; fill:#333 }
      .qmark { font-size:28px; fill:#999 }
    </style>
  </defs>

  <!-- Grid lines -->
  <line x1="113" y1="10" x2="113" y2="330" stroke="#ddd"/>
  <line x1="226" y1="10" x2="226" y2="330" stroke="#ddd"/>
  <line x1="10" y1="113" x2="330" y2="113" stroke="#ddd"/>
  <line x1="10" y1="226" x2="330" y2="226" stroke="#ddd"/>

  <!-- Row 1 -->
  <!-- (1,1): Large circle -->
  <rect x="15" y="15" width="83" height="83" class="frame"/>
  <circle cx="56" cy="56" r="30" class="shape"/>

  <!-- (1,2): Medium circle with dot -->
  <rect x="128" y="15" width="83" height="83" class="frame"/>
  <circle cx="169" cy="56" r="22" class="shape"/>
  <circle cx="169" cy="56" r="5" fill="#000"/>

  <!-- (1,3): Small circle with 2 dots -->
  <rect x="241" y="15" width="83" height="83" class="frame"/>
  <circle cx="282" cy="56" r="15" class="shape"/>
  <circle cx="276" cy="50" r="3" fill="#000"/>
  <circle cx="288" cy="62" r="3" fill="#000"/>

  <!-- Row 2 -->
  <!-- (2,1): Large square -->
  <rect x="15" y="128" width="83" height="83" class="frame"/>
  <rect x="33" y="146" width="46" height="46" class="shape"/>

  <!-- (2,2): Medium square with dot -->
  <rect x="128" y="128" width="83" height="83" class="frame"/>
  <rect x="148" y="148" width="42" height="42" class="shape"/>
  <circle cx="169" cy="169" r="5" fill="#000"/>

  <!-- (2,3): Small square with 2 dots -->
  <rect x="241" y="128" width="83" height="83" class="frame"/>
  <rect x="263" y="150" width="38" height="38" class="shape"/>
  <circle cx="276" cy="163" r="3" fill="#000"/>
  <circle cx="288" cy="175" r="3" fill="#000"/>

  <!-- Row 3 -->
  <!-- (3,1): Large triangle -->
  <rect x="15" y="241" width="83" height="83" class="frame"/>
  <polygon points="56,261 86,301 26,301" class="shape"/>

  <!-- (3,2): Medium triangle with dot -->
  <rect x="128" y="241" width="83" height="83" class="frame"/>
  <polygon points="169,254 192,284 146,284" class="shape"/>
  <circle cx="169" cy="273" r="4" fill="#000"/>

  <!-- (3,3): ? -->
  <rect x="241" y="241" width="83" height="83" class="frame"/>
  <text x="282" y="288" text-anchor="middle" class="qmark" font-family="Arial">?</text>
</svg>
