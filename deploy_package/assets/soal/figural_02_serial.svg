<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100">
  <defs>
    <style>
      .shape { fill:none; stroke:#000; stroke-width:2 }
      .label { font-family:Arial,sans-serif; font-size:12px; fill:#666 }
      .arrow { fill:#666 }
    </style>
  </defs>

  <!-- 1. Square with single diagonal line -->
  <rect x="15" y="20" width="45" height="45" class="shape"/>
  <line x1="15" y1="20" x2="60" y2="65" class="shape"/>
  <text x="37" y="90" text-anchor="middle" class="label">1</text>

  <!-- Arrow -->
  <polygon points="72,42 82,47 72,52" class="arrow"/>

  <!-- 2. Square with two diagonal lines (X) -->
  <rect x="95" y="20" width="45" height="45" class="shape"/>
  <line x1="95" y1="20" x2="140" y2="65" class="shape"/>
  <line x1="140" y1="20" x2="95" y2="65" class="shape"/>
  <text x="117" y="90" text-anchor="middle" class="label">2</text>

  <!-- Arrow -->
  <polygon points="152,42 162,47 152,52" class="arrow"/>

  <!-- 3. Square with three lines (two diagonal + horizontal) -->
  <rect x="175" y="20" width="45" height="45" class="shape"/>
  <line x1="175" y1="20" x2="220" y2="65" class="shape"/>
  <line x1="220" y1="20" x2="175" y2="65" class="shape"/>
  <line x1="175" y1="42" x2="220" y2="42" class="shape"/>
  <text x="197" y="90" text-anchor="middle" class="label">3</text>

  <!-- Arrow -->
  <polygon points="232,42 242,47 232,52" class="arrow"/>

  <!-- 4. Square with four lines (X + horizontal + vertical) -->
  <rect x="255" y="20" width="45" height="45" class="shape"/>
  <line x1="255" y1="20" x2="300" y2="65" class="shape"/>
  <line x1="300" y1="20" x2="255" y2="65" class="shape"/>
  <line x1="255" y1="42" x2="300" y2="42" class="shape"/>
  <line x1="277" y1="20" x2="277" y2="65" class="shape"/>
  <text x="277" y="90" text-anchor="middle" class="label">4</text>

  <!-- Arrow -->
  <polygon points="312,42 322,47 312,52" class="arrow"/>

  <!-- 5. Square with five lines (X + horiz + vert + another) -->
  <rect x="335" y="20" width="45" height="45" class="shape"/>
  <line x1="335" y1="20" x2="380" y2="65" class="shape"/>
  <line x1="380" y1="20" x2="335" y2="65" class="shape"/>
  <line x1="335" y1="42" x2="380" y2="42" class="shape"/>
  <line x1="357" y1="20" x2="357" y2="65" class="shape"/>
  <text x="357" y="90" text-anchor="middle" class="label">5</text>

  <!-- Arrow -->
  <polygon points="392,42 402,47 392,52" class="arrow"/>

  <!-- 6. Question mark box -->
  <rect x="415" y="20" width="45" height="45" class="shape"/>
  <text x="437" y="50" text-anchor="middle" font-size="22" fill="#999" font-family="Arial">?</text>
  <text x="437" y="90" text-anchor="middle" class="label">?</text>
</svg>
