<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180">
  <defs>
    <style>
      .edge { fill:none; stroke:#000; stroke-width:1.5 }
      .hidden { fill:none; stroke:#999; stroke-width:1; stroke-dasharray:3,3 }
      .label { font-family:Arial,sans-serif; font-size:12px; fill:#333 }
    </style>
  </defs>

  <!-- 2D Base shape -->
  <rect x="30" y="80" width="60" height="60" class="edge"/>
  <line x1="30" y1="80" x2="60" y2="50" class="edge"/>
  <line x1="90" y1="80" x2="120" y2="50" class="edge"/>
  <line x1="120" y1="50" x2="120" y2="110" class="edge"/>
  <line x1="60" y1="50" x2="120" y2="50" class="edge"/>
  <line x1="60" y1="50" x2="60" y2="110" class="hidden"/>
  <line x1="60" y1="110" x2="120" y2="110" class="hidden"/>
  <line x1="90" y1="140" x2="120" y2="110" class="edge"/>
  <text x="75" y="160" text-anchor="middle" class="label">Gambar Asli</text>

  <!-- Arrow -->
  <text x="140" y="100" font-size="16" fill="#666">&#8594;</text>

  <!-- 3D Rotated shape (perspective view) -->
  <polygon points="190,120 230,120 240,90 200,90" class="edge"/>
  <polygon points="190,120 200,90 200,60 190,90" class="edge"/>
  <polygon points="230,120 240,90 240,60 230,90" class="hidden"/>
  <polygon points="200,60 240,60 230,90 190,90" class="edge"/>
  <line x1="190" y1="90" x2="230" y2="90" class="hidden"/>
  <line x1="230" y1="90" x2="230" y2="120" class="edge"/>
  <line x1="200" y1="90" x2="200" y2="60" class="edge"/>
  <line x1="240" y1="90" x2="240" y2="60" class="edge"/>
  <text x="215" y="160" text-anchor="middle" class="label">Hasil Rotasi</text>
</svg>
