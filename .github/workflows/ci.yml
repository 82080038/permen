name: CI/CD Pipeline - SKD CAT-BKN

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skd_cat_bkn
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, pdo, pdo_mysql
        coverage: none
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install PHP dependencies
      run: |
        composer install --no-interaction --prefer-dist --no-dev
    
    - name: Install Node dependencies
      run: |
        npm ci
    
    - name: Install Playwright browsers
      run: |
        npx playwright install --with-deps chromium
    
    - name: Setup environment
      run: |
        cp .env.example .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_NAME=skd_cat_bkn" >> .env
        echo "DB_USER=root" >> .env
        echo "DB_PASS=root" >> .env
        echo "APP_ENV=testing" >> .env
        echo "BASE_URL=http://localhost" >> .env
    
    - name: Import database
      run: |
        mysql -h 127.0.0.1 -u root -proot skd_cat_bkn < sql/skd_cat_bkn.sql || true
        mysql -h 127.0.0.1 -u root -proot skd_cat_bkn < sql/batch_master_materi.sql || true
        mysql -h 127.0.0.1 -u root -proot skd_cat_bkn < sql/batch_tips.sql || true
    
    - name: Start PHP server
      run: |
        php -S localhost:8000 -t . &
        sleep 5
    
    - name: Run Playwright tests
      run: |
        npx playwright test
      env:
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, pdo, pdo_mysql
        tools: phpstan, phpcs
    
    - name: Run PHPStan
      run: |
        composer require --dev phpstan/phpstan
        vendor/bin/phpstan analyse --level=5 .
      continue-on-error: true
    
    - name: Run PHPCS
      run: |
        composer require --dev squizlabs/php_codesniffer
        vendor/bin/phpcs --standard=PSR12 .
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run security audit
      run: |
        composer audit
      continue-on-error: true
