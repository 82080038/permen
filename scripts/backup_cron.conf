# Automated Database Backup Cron Job
# SKD CAT-BKN Application
# 
# Installation Instructions:
# 1. Copy this file to /etc/cron.d/permen_backup (Linux) or add to crontab
# 2. Make backup_database.sh executable: chmod +x /opt/lampp/htdocs/permen/scripts/backup_database.sh
# 3. Adjust paths as needed for your environment
#
# Daily backup at 2:00 AM
0 2 * * * root /opt/lampp/htdocs/permen/scripts/backup_database.sh >> /var/log/permen_backup.log 2>&1

# Weekly backup on Sunday at 3:00 AM (additional full backup)
0 3 * * 0 root /opt/lampp/htdocs/permen/scripts/backup_database.sh >> /var/log/permen_backup.log 2>&1

# Hourly backup during business hours (9 AM - 6 PM) - optional
# 0 9-18 * * * root /opt/lampp/htdocs/permen/scripts/backup_database.sh >> /var/log/permen_backup.log 2>&1
